# WarmPlayer · 群晖 Container Manager / 任意 Docker 主机
# 用法：把 MUSIC_ROOT 改成你的音乐共享实际卷路径（ls /volume*/Music 确认），
#       docker compose up -d --build
services:
  warmplayer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: warmplayer:latest
    container_name: warmplayer
    restart: unless-stopped
    ports:
      - "8900:8900"
    volumes:
      - /volume1/docker/warmplayer/data:/data
      - ${MUSIC_ROOT:-/volume1/Music}:/music:ro
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8900/api/health',timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s